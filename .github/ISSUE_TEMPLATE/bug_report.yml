name: Bug report
description: Something in Dropwell does not work as it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report this. Issues here are public.

        **Never attach bank statements, forms or personal data.** Describe the problem and the layout in words only, and never attach any statement or form, not even an edited copy.
  - type: input
    id: version
    attributes:
      label: Dropwell version
      description: Dropwell menu, About Dropwell.
      placeholder: "1.0 (3)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Apple menu, About This Mac.
      placeholder: "macOS 15.1"
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Mac
      options:
        - Apple silicon (M1 or later)
        - Intel
        - I do not know
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - Bank Statements
        - Fill & Sign
        - Hide & Redact
        - Shrink to Size
        - Merge and Edit Pages
        - Scan Cleanup
        - Rules
        - AI connection
        - Finder menu
        - License, activation or updates
        - Something else
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: The steps, one per line, so we can try the same thing.
      placeholder: |
        1. Dropped a 3 page statement on the window
        2. Chose Excel
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The message Dropwell showed, word for word if there was one. Words only, no screenshot of a statement or form.
    validations:
      required: true
  - type: textarea
    id: statement
    attributes:
      label: For bank statements
      description: The bank and country, text PDF or scan, and what the columns look like (for example Date, Description, Withdrawals, Deposits, Balance). No account numbers, names or amounts.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue holds no bank statement, form or personal data.
          required: true
